<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>baton</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background:#111; color:#eee; margin:0; padding:24px; }
  h1 { font-size:20px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { padding:8px 16px; border:0; border-radius:6px; cursor:pointer; font-size:14px; }
  #push { background:#2d6cdf; color:#fff; }
  #pull { background:#2e7d32; color:#fff; }
  .card { background:#1c1c1c; border:1px solid #333; border-radius:8px; padding:16px; margin-top:16px; }
  .badge { padding:2px 10px; border-radius:999px; font-size:12px; }
  .badge.play { background:#2e7d32; }
  .badge.pause { background:#b26a00; }
  .badge.stop { background:#555; }
  ul { list-style:none; padding:0; margin:8px 0 0; }
  li { padding:4px 8px; border-radius:4px; }
  li.current { background:#2d6cdf55; }
  .meta { color:#999; font-size:13px; margin-top:8px; }
  #msg { color:#ffb74d; margin-top:12px; min-height:18px; }
</style>
</head>
<body>
  <div class="row">
    <h1>baton</h1>
    <span id="state" class="badge">…</span>
    <input id="token" type="password" placeholder="API token (optional)" style="background:#1c1c1c;border:1px solid #333;border-radius:6px;color:#eee;padding:6px 10px;font-size:13px;">
    <span style="flex:1"></span>
    <button id="push">⇧ Push to Navidrome</button>
    <button id="pull">⇩ Pull from Navidrome</button>
  </div>

  <div class="card">
    <strong>Current song</strong>
    <div id="current" class="meta">…</div>
    <div id="position" class="meta">…</div>
    <div id="meta" class="meta">…</div>
  </div>

  <div class="card">
    <strong>Queue</strong>
    <ul id="queue"></ul>
  </div>

  <div id="msg"></div>

<script>
const $ = s => document.querySelector(s);
let data = null;

// optional bearer token for the API, remembered across reloads
const TOKEN_KEY = 'baton_token';
$('#token').value = localStorage.getItem(TOKEN_KEY) || '';
$('#token').addEventListener('input', e => {
  localStorage.setItem(TOKEN_KEY, e.target.value.trim());
});

function headers() {
  const t = localStorage.getItem(TOKEN_KEY) || '';
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}

function badge(state) {
  return `<span class="badge ${state}">${state}</span>`;
}

function render() {
  $('#state').textContent = data.mpd_state || 'unknown';
  $('#state').className = 'badge ' + (data.mpd_state || '');
  $('#current').textContent = data.current_song || '(none)';
  $('#position').textContent = data.position_ms != null ? (data.position_ms/1000).toFixed(1) + 's' : '';
  $('#meta').innerHTML =
    `mode: ${data.mode || ''} &nbsp; remote changed: ${data.remote_changed || '-'} &nbsp; last push: ${data.last_push_ts || '-'}`;

  const ul = $('#queue');
  ul.innerHTML = '';
  (data.queue || []).forEach((f, i) => {
    const li = document.createElement('li');
    if (f === data.current_song) li.className = 'current';
    li.textContent = `${i+1}. ${f}`;
    ul.appendChild(li);
  });
}

async function refresh() {
  try {
    const r = await fetch('/api/status', { headers: headers() });
    if (r.status === 401) { $('#msg').textContent = 'unauthorized: set API token'; return; }
    data = await r.json();
    render();
  } catch (e) {
    $('#msg').textContent = 'status error: ' + e.message;
  }
}

async function act(ep) {
  $('#msg').textContent = '…';
  try {
    const r = await fetch(ep, { method: 'POST', headers: headers() });
    if (r.status === 401) { $('#msg').textContent = 'unauthorized: set API token'; return; }
    const j = await r.json();
    $('#msg').textContent = j.status || 'ok';
  } catch (e) {
    $('#msg').textContent = 'error: ' + e.message;
  }
  refresh();
}

$('#push').addEventListener('click', () => act('/api/push'));
$('#pull').addEventListener('click', () => act('/api/pull'));

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>

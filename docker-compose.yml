name: baton

services:
  baton:
    build: .
    container_name: baton
    restart: unless-stopped
    network_mode: bridge
    environment:
      # The bridge gateway 172.17.0.1 reaches the host. Override via .env for
      # other topologies (e.g. Navidrome in its own container -> http://navidrome:4533).
      MPD_HOST: ${MPD_HOST:-172.17.0.1}
      MPD_PORT: ${MPD_PORT:-6600}
      MPD_PASSWORD: ${MPD_PASSWORD:-}
      NAVIDROME_URL: ${NAVIDROME_URL:?set in .env — URL or host:port of your Navidrome}
      NAVIDROME_USER: ${NAVIDROME_USER:?set in .env}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:?set in .env}
      NAVIDROME_LEGACY_AUTH: ${NAVIDROME_LEGACY_AUTH:-0}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
      MODE: ${MODE:-auto}
      BATON_LISTEN: ${BATON_LISTEN:-0.0.0.0:8080}
      BATON_API_TOKEN: ${BATON_API_TOKEN:-}
    ports:
      - "${BATON_PORT:-8080}:8080"
